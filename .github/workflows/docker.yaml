name: Build ABIA SIP (publication disabled)

# Controls when the action will run.
on:
  workflow_dispatch:
  push:
    # only publish on version tags
    tags:
      - "v*.*.*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: apps/realtime/sip

      # Keep this ref aligned with the protocol gitlink pinned by the ABIA root.
      # Private sibling repositories require ABIA_SUBMODULES_READ_TOKEN in this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: junielbrizola/abia-protocol
          ref: 36e1b27375d9f560868642642bdd0f669a610756
          token: ${{ secrets.ABIA_SUBMODULES_READ_TOKEN || github.token }}
          path: apps/realtime/protocol

      - name: Docker metadata
        id: docker-md
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: abia-realtime-sip
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26"

      - name: Download Go modules
        working-directory: apps/realtime/sip
        run: go mod download

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract version from tag
        id: version
        working-directory: apps/realtime/sip
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build SIP image (publication disabled)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./apps/realtime
          file: ./apps/realtime/sip/build/sip/Dockerfile
          # Verification only. ABIA publication stays disabled until its Artifact Registry
          # destination and authorized publishing identity are configured explicitly.
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-md.outputs.tags }}
          labels: ${{ steps.docker-md.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
