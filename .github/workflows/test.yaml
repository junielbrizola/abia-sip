name: Test
on:
  push:
    branches:
      - main
      - ci_test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: namespace-profile-8vcpu-cache
    defaults:
      run:
        working-directory: apps/realtime/sip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: apps/realtime/sip

      # Match the sibling layout consumed by the SIP and Server go.mod replacements.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: junielbrizola/abia-realtime-server
          ref: c5c8ec507dfec495e89eb64a3370645473d4f6b7
          token: ${{ secrets.ABIA_SUBMODULES_READ_TOKEN || github.token }}
          path: apps/realtime/server

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: junielbrizola/abia-protocol
          ref: 36e1b27375d9f560868642642bdd0f669a610756
          token: ${{ secrets.ABIA_SUBMODULES_READ_TOKEN || github.token }}
          path: apps/realtime/protocol

      - name: Install Opus dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libopusfile-dev libsoxr-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/realtime/sip/go.mod

      - name: Set up tparse
        run: go install github.com/mfridman/tparse@v0.17.0

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: apps/realtime/sip

      - name: Test
        run: |
          set -euo pipefail
          go test -coverpkg=./... -race -json -v -coverprofile=coverage.out -covermode=atomic ./pkg/... 2>&1 | tee /tmp/gotest.log | tparse

      - name: Pull Redis test image
        run: |
          docker pull redis

      - name: Resolve Server Go version
        id: server-go-version
        working-directory: apps/realtime/server
        run: |
          version=$(.github/scripts/go-version.sh Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Server Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.server-go-version.outputs.version }}

      - name: Generate Server sources
        working-directory: apps/realtime/server
        run: go run github.com/magefile/mage generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ABIA Server fixture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/realtime
          file: ./apps/realtime/server/Dockerfile
          platforms: linux/amd64
          tags: abia-realtime-server:ci
          load: true

      - name: Test E2E
        env:
          SIP_TEST_LIVEKIT_SERVER_REPOSITORY: abia-realtime-server
          SIP_TEST_LIVEKIT_SERVER_TAG: ci
        run: |
          set -euo pipefail
          go test -coverpkg=./... -json -v -coverprofile=coverage2.out -covermode=atomic ./test/integration/... 2>&1 | tee -a /tmp/gotest.log | tparse

      - name: Upload test log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-log
          path: /tmp/gotest.log
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: apps/realtime/sip/coverage.out,apps/realtime/sip/coverage2.out
